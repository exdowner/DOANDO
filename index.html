<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio Conta Free Fire | NullContas</title>
    <style>
        /* Reset e base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0b0b0b;
            background-image: radial-gradient(circle at 20% 30%, #1e1e1e 0%, #0a0a0a 90%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #f0f0f0;
        }

        /* Card principal com gradiente */
        .main-card {
            background: linear-gradient(145deg, #141414, #1f1f1f);
            border-radius: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.03);
            max-width: 800px;
            width: 100%;
            padding: 2.5rem 2rem;
            transition: all 0.3s ease;
            border: 1px solid #2e2e2e;
        }

        /* Cabeçalho */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #3a3a3a, #1f1f1f);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #3d3d3d;
        }

        .logo-icon svg {
            width: 28px;
            height: 28px;
            fill: #ffffff;
            filter: drop-shadow(0 0 6px rgba(255,255,255,0.3));
        }

        .logo-text h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #b0b0b0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-text span {
            font-size: 0.85rem;
            color: #888;
            display: block;
            font-weight: 400;
        }

        .badge {
            background: #2a2a2a;
            padding: 0.5rem 1rem;
            border-radius: 60px;
            font-size: 0.8rem;
            border: 1px solid #3f3f3f;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ddd;
        }

        .badge svg {
            width: 16px;
            height: 16px;
            fill: #fff;
        }

        /* Vídeo / Mídia */
        .media-showcase {
            margin: 1.5rem 0 2rem;
            border-radius: 1.5rem;
            overflow: hidden;
            background: #0d0d0d;
            border: 1px solid #2e2e2e;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }

        .media-container {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #181818, #0f0f0f);
            padding: 1rem;
        }

        .media-container img {
            max-width: 100%;
            max-height: 220px;
            border-radius: 1rem;
            object-fit: cover;
            border: 1px solid #333;
            transition: transform 0.2s;
        }

        .media-container video {
            max-width: 100%;
            max-height: 220px;
            border-radius: 1rem;
            border: 1px solid #333;
            background: #000;
        }

        .media-caption {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1.2rem;
            background: #141414;
            border-top: 1px solid #2a2a2a;
            font-size: 0.85rem;
            color: #aaa;
        }

        /* Info prêmio */
        .prize-info {
            display: flex;
            justify-content: center;
            gap: 2rem;
            background: #111;
            border-radius: 100px;
            padding: 0.8rem 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid #2c2c2c;
            flex-wrap: wrap;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ccc;
            font-size: 0.9rem;
        }

        .info-item svg {
            width: 18px;
            height: 18px;
            fill: #fff;
            opacity: 0.8;
        }

        /* Botões de ação */
        .actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin: 1.8rem 0;
        }

        .btn {
            border: none;
            border-radius: 60px;
            padding: 1rem 1.8rem;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: linear-gradient(135deg, #2b2b2b, #1c1c1c);
            color: white;
            border: 1px solid #3d3d3d;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            letter-spacing: 0.2px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ffffff, #d4d4d4);
            color: #111;
            border: 1px solid #ffffff;
            box-shadow: 0 8px 20px rgba(255,255,255,0.1);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #f0f0f0, #bdbdbd);
            transform: translateY(-2px);
        }

        .btn:hover {
            transform: translateY(-2px);
            border-color: #5a5a5a;
        }

        .btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .btn-primary svg {
            fill: #111;
        }

        /* Boost section */
        .boost-section {
            margin-top: 2rem;
            background: #101010;
            border-radius: 1.8rem;
            padding: 1.5rem;
            border: 1px solid #2b2b2b;
        }

        .boost-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1.2rem;
            color: #e0e0e0;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .boost-title svg {
            width: 22px;
            height: 22px;
            fill: #fff;
        }

        .boost-options {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }

        .boost-card {
            background: linear-gradient(145deg, #1a1a1a, #111);
            border-radius: 1.5rem;
            padding: 1.2rem 1.5rem;
            flex: 1 1 130px;
            text-align: center;
            border: 1px solid #2e2e2e;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
        }

        .boost-card:hover {
            border-color: #6b6b6b;
            background: #1e1e1e;
            transform: scale(1.02);
        }

        .boost-card.selected {
            border-color: #ffffff;
            background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
            box-shadow: 0 0 0 2px rgba(255,255,255,0.2);
        }

        .boost-price {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
        }

        .boost-price small {
            font-size: 0.9rem;
            font-weight: 400;
            color: #aaa;
        }

        .boost-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #999;
            margin-top: 6px;
        }

        .boost-multiplier {
            font-size: 0.75rem;
            background: #2e2e2e;
            padding: 4px 8px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 8px;
            color: #ddd;
        }

        /* Formulários (modal) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: linear-gradient(145deg, #181818, #0e0e0e);
            border-radius: 2rem;
            max-width: 500px;
            width: 100%;
            padding: 2rem 1.8rem;
            border: 1px solid #333;
            box-shadow: 0 30px 50px rgba(0,0,0,0.9);
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-card h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-card h2 svg {
            width: 28px;
            height: 28px;
            fill: #fff;
        }

        .modal-sub {
            color: #888;
            margin-bottom: 1.8rem;
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #bbb;
            margin-bottom: 0.4rem;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            background: #1f1f1f;
            border: 1px solid #333;
            border-radius: 14px;
            padding: 0.9rem 1rem;
            font-size: 0.95rem;
            color: #fff;
            outline: none;
            transition: 0.2s;
        }

        .input-group input:focus {
            border-color: #777;
            background: #252525;
        }

        .input-group input::placeholder {
            color: #5f5f5f;
        }

        .file-hint {
            font-size: 0.75rem;
            color: #777;
            margin-top: 4px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 1.8rem;
        }

        .modal-actions .btn {
            padding: 0.9rem;
            flex: 1;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid #444;
            color: #ccc;
        }

        .btn-ghost:hover {
            background: #1f1f1f;
        }

        /* Mensagem de sucesso */
        .success-message {
            text-align: center;
            padding: 1.5rem 0;
        }

        .success-message svg {
            width: 64px;
            height: 64px;
            fill: #fff;
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        .success-message h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .success-message p {
            color: #999;
            font-size: 0.95rem;
        }

        /* Redes sociais */
        .social-footer {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            padding-top: 1rem;
            border-top: 1px solid #232323;
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #b0b0b0;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .social-link svg {
            width: 22px;
            height: 22px;
            fill: #b0b0b0;
            transition: fill 0.2s;
        }

        .social-link:hover {
            color: #fff;
        }

        .social-link:hover svg {
            fill: #fff;
        }

        /* Aviso inscrito */
        .registered-badge {
            background: #1f1f1f;
            border: 1px solid #3a3a3a;
            border-radius: 60px;
            padding: 0.9rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #ddd;
            font-weight: 500;
            margin: 1.5rem 0;
        }

        .registered-badge svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }

        /* Responsivo */
        @media (max-width: 550px) {
            .main-card {
                padding: 1.8rem 1.2rem;
            }
            .boost-options {
                flex-direction: column;
            }
            .boost-card {
                width: 100%;
            }
            .media-container img,
            .media-container video {
                max-height: 160px;
            }
        }
    </style>
</head>

        <!-- Área principal de participação (verifica localStorage) -->

    <!-- Modal de formulário -->

            <!-- Conteúdo dinâmico -->
        </div>

    <script>
        (function() {
            // Elementos principais
            const mainActionArea = document.getElementById('mainActionArea');
            const modalOverlay = document.getElementById('modalOverlay');
            const modalCard = document.getElementById('modalCard');
            const boostCards = document.querySelectorAll('.boost-card');
            
            // Estado
            let selectedBoost = null; // null = participação normal, 1,3,5 = boost

            // Verifica localStorage
            function getRegistration() {
                const reg = localStorage.getItem('ff_sorteio_inscrito');
                return reg ? JSON.parse(reg) : null;
            }

            function setRegistration(data) {
                localStorage.setItem('ff_sorteio_inscrito', JSON.stringify(data));
            }

            // Atualiza a área principal conforme inscrição
            function updateMainArea() {
                const reg = getRegistration();
                if (reg) {
                    mainActionArea.innerHTML = `
                        <div class="registered-badge">
                            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
                            Você já está inscrito! Boa sorte 🍀
                        </div>
                    `;
                } else {
                    mainActionArea.innerHTML = `
                        <button class="btn btn-primary" id="btnParticipar">
                            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
                            Participar do sorteio
                        </button>
                    `;
                    // Rebind
                    document.getElementById('btnParticipar').addEventListener('click', () => {
                        selectedBoost = null;
                        openFormModal(null);
                    });
                }
            }

            // Abre modal com formulário
            function openFormModal(boostValue) {
                // boostValue: null (normal), 1,3,5
                const isBoost = boostValue !== null;
                const reg = getRegistration();
                
                // Se já inscrito e tentar boost? Permitimos, mas avisamos (opcional)
                // Mas se já inscrito normal, pode fazer boost? Sim, mas vamos permitir.
                // Porém, se já inscrito com boost, mostramos mensagem?
                
                let title, subtitle, extraFields = '';
                if (isBoost) {
                    title = `Boost R$${boostValue},00`;
                    subtitle = `Preencha os dados e anexe o comprovante para dobrar suas chances!`;
                    extraFields = `
                        <div class="input-group">
                            <label>Nome da conta que efetuou o pagamento</label>
                            <input type="text" id="nomeContaPagamento" placeholder="Ex: João Silva" required>
                        </div>
                        <div class="input-group">
                            <label>Foto do comprovante</label>
                            <input type="file" id="comprovante" accept="image/*" required>
                            <div class="file-hint">Formatos: JPG, PNG. Tamanho máximo 5MB</div>
                        </div>
                    `;
                } else {
                    title = 'Participar do sorteio';
                    subtitle = 'Preencha seus dados para concorrer à conta Free Fire.';
                }

                // Verifica se já inscrito (normal)
                if (!isBoost && reg) {
                    // Já inscrito, mas ainda permite abrir? Melhor mostrar mensagem
                    modalCard.innerHTML = `
                        <div class="success-message">
                            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                            <h3>Você já está inscrito!</h3>
                            <p>Aguarde o sorteio. Boa sorte! 🍀</p>
                        </div>
                        <div class="modal-actions">
                            <button class="btn btn-ghost" id="closeModalBtn">Fechar</button>
                        </div>
                    `;
                    modalOverlay.classList.add('active');
                    document.getElementById('closeModalBtn').addEventListener('click', closeModal);
                    return;
                }

                modalCard.innerHTML = `
                    <h2>
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                        ${title}
                    </h2>
                    <div class="modal-sub">${subtitle}</div>
                    <form id="sorteioForm">
                        <div class="input-group">
                            <label>Seu nome completo</label>
                            <input type="text" id="nome" placeholder="Ex: Maria Souza" required>
                        </div>
                        <div class="input-group">
                            <label>Seu melhor e-mail</label>
                            <input type="email" id="email" placeholder="exemplo@email.com" required>
                        </div>
                        ${extraFields}
                        <div class="modal-actions">
                            <button type="button" class="btn btn-ghost" id="cancelModalBtn">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Enviar inscrição</button>
                        </div>
                    </form>
                `;

                modalOverlay.classList.add('active');

                // Eventos do modal
                document.getElementById('cancelModalBtn').addEventListener('click', closeModal);
                
                const form = document.getElementById('sorteioForm');
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    
                    const nome = document.getElementById('nome').value.trim();
                    const email = document.getElementById('email').value.trim();
                    
                    if (!nome || !email) {
                        alert('Por favor, preencha nome e e-mail.');
                        return;
                    }
                    
                    let boostData = null;
                    if (isBoost) {
                        const nomeConta = document.getElementById('nomeContaPagamento')?.value.trim();
                        const comprovanteInput = document.getElementById('comprovante');
                        const file = comprovanteInput?.files[0];
                        
                        if (!nomeConta) {
                            alert('Informe o nome da conta que efetuou o pagamento.');
                            return;
                        }
                        if (!file) {
                            alert('Anexe a foto do comprovante.');
                            return;
                        }
                        
                        boostData = {
                            tipo: 'boost',
                            valor: boostValue,
                            nomeConta: nomeConta,
                            comprovanteNome: file.name
                            // Não armazenamos o arquivo em si por limitações, apenas o nome
                        };
                    }
                    
                    // Salva no localStorage
                    const registrationData = {
                        nome: nome,
                        email: email,
                        boost: boostData,
                        dataInscricao: new Date().toISOString()
                    };
                    setRegistration(registrationData);
                    
                    // Mostra mensagem de sucesso
                    modalCard.innerHTML = `
                        <div class="success-message">
                            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                            <h3>Inscrição confirmada!</h3>
                            <p>${isBoost ? 'Boost ativado com sucesso! Suas chances aumentaram.' : 'Você está participando do sorteio. Boa sorte!'}</p>
                        </div>
                        <div class="modal-actions">
                            <button class="btn btn-primary" id="closeSuccessBtn">Fechar</button>
                        </div>
                    `;
                    document.getElementById('closeSuccessBtn').addEventListener('click', () => {
                        closeModal();
                        updateMainArea(); // atualiza área principal
                    });
                    
                    // Atualiza área principal imediatamente (já inscrito)
                    updateMainArea();
                });
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
            }

            // Fecha modal ao clicar fora
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) {
                    closeModal();
                }
            });

            // Configurar boost cards
            boostCards.forEach(card => {
                card.addEventListener('click', () => {
                    const boostValue = parseInt(card.getAttribute('data-boost'));
                    
                    // Destaca o selecionado
                    boostCards.forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    
                    // Abre o modal com o boost
                    openFormModal(boostValue);
                });
            });

            // Inicializa
            updateMainArea();

            // Tenta carregar o vídeo se existir
            const video = document.getElementById('videoPreview');
            if (video) {
                video.addEventListener('loadeddata', () => {
                    video.style.display = 'block';
                    // Esconde a imagem se o vídeo carregar
                    const img = document.querySelector('.media-container img');
                    if (img) img.style.display = 'none';
                });
                video.addEventListener('error', () => {
                    video.style.display = 'none';
                });
                // Tenta carregar
                video.load();
            }
        })();
    </script>
</body>
</html>
